name: enrich-samples

on:
  # Rebuild after media restoration/fixes.
  push:
    branches: [main]
    paths-ignore:
      - "scripts/refresh-affiliate.trigger"
      - "data/products.json"
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gravure-dvd-auto-main-write
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Enrich FANZA sample media
        timeout-minutes: 15
        continue-on-error: true
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
        run: python -m affiliate.sample_enrichment
      - name: Enrich FANZA affiliate links
        timeout-minutes: 10
        continue-on-error: true
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
        run: python -m affiliate.dmm_fanza
      - name: Refresh DMM samplepickup images (num=1..15)
        run: python -m affiliate.dmm_samplepickup
      - name: Clean sample gallery assets
        run: python -m affiliate.clean_sample_media
      - name: Generate static site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python site/generate.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json dist/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: enrich sample media"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
