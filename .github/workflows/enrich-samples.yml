name: enrich-samples

on:
  push:
    branches: [main]
    paths:
      - "affiliate/sample_enrichment.py"
      - "affiliate/clean_sample_media.py"
      - "site/generate.py"
      - "requirements.txt"
      - ".github/workflows/enrich-samples.yml"
  workflow_run:
    workflows: ["auto-update"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gravure-dvd-auto-sample-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Enrich FANZA sample media
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
        run: python -m affiliate.sample_enrichment
      - name: Clean sample gallery assets
        run: python -m affiliate.clean_sample_media
      - name: Generate static site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python site/generate.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json dist/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: enrich sample media"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
