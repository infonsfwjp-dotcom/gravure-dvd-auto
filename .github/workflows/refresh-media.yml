name: Refresh generated site media
on:
  push:
    branches: [main]
    paths:
      - "site/generate.py"
permissions:
  contents: write
concurrency:
  group: gravure-dvd-auto-media-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Regenerate site and mirror media
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python site/generate.py
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh generated site media"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
