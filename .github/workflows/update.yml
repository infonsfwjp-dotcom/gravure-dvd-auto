name: deploy-site
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: gravure-dvd-auto-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install site dependencies
        run: pip install -r requirements.txt
      - name: Generate static site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python site/generate.py
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify public routes
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -e
          for path in "/" "/products/i-one-LCDV-41448" "/products/i-one-LCDV-41448.html"; do
            echo "Checking $SITE_URL$path"
            code=$(curl -L -sS -D /tmp/headers.txt -o /tmp/page.html -w "%{http_code}" --retry 3 --retry-delay 2 "$SITE_URL$path")
            test "$code" = "200"
            grep -qi '^content-type: text/html' /tmp/headers.txt || { echo "Expected text/html content type"; cat /tmp/headers.txt; exit 1; }
            grep -q "LCDV-41448\|日下部式学習法" /tmp/page.html || { echo "Expected LCDV-41448 content missing"; exit 1; }
            if [ "$path" = "/products/i-one-LCDV-41448" ]; then
              img_count=$(grep -o 'サンプル画像' /tmp/page.html | wc -l | tr -d ' ')
              test "$img_count" -ge 12 || { echo "Expected at least 12 sample-image references, got $img_count"; exit 1; }
              grep -q 'n_691lcdv41448pl.jpg\|/media/' /tmp/page.html || { echo "Expected high-res cover/media asset missing"; exit 1; }
              ! grep -q 'JAN' /tmp/page.html || { echo "JAN must not be shown"; exit 1; }
            fi
            echo "OK $code text/html $path"
          done
