name: auto-update
on:
  push:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh]
permissions:
  contents: write
concurrency:
  group: gravure-dvd-auto-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Snapshot existing products
        run: cp data/products.json data/products_before.json || true
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Discover new releases from FANZA by manufacturer
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          DMM_SITE: FANZA
        run: python -m affiliate.dmm_discovery
      - name: Enrich FANZA/DMM affiliate links
        timeout-minutes: 15
        continue-on-error: true
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
        run: python -m affiliate.dmm_fanza
      - name: Enrich FANZA sample media
        timeout-minutes: 10
        continue-on-error: true
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
        run: python -m affiliate.sample_enrichment
      - name: Remove duplicate limited cheki variants
        run: python scripts/dedupe_limited_variants.py
      - name: Generate static site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python site/generate.py
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Post newly discovered releases to X
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python -m affiliate.x_post
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/scrape_errors.log dist/ || true
          if [ -f data/x_posted.json ]; then git add data/x_posted.json; fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: auto-update releases"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
